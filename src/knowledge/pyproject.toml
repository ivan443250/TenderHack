[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tenderhack-knowledge"
version = "0.1.0"
description = "TenderHack evidence and inference service scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pyyaml>=6.0,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
tenderhack-knowledge = "tenderhack_knowledge.main:run"
tenderhack-knowledge-worker = "tenderhack_knowledge.worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/tenderhack_knowledge"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
