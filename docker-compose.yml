services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tenderhack
      POSTGRES_USER: tenderhack
      POSTGRES_PASSWORD: tenderhack
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderhack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/TenderHack.Web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=tenderhack;Username=tenderhack;Password=tenderhack"
      Ml__BaseUrl: "http://ml:8000"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "8080:8080"

  # ml: FastAPI + uvicorn inference service (section 3.1). Placeholder until the Python
  # team adds ./ml — api degrades to no_answer / safe defaults while this is absent (section 10).
  # ml:
  #   build: ./ml
  #   ports:
  #     - "8000:8000"

  # ingest: one-shot job that parses source materials and populates kb_* tables (section 6.2).
  # ingest:
  #   build: ./ingest
  #   depends_on:
  #     db:
  #       condition: service_healthy

  # web: React + Vite + TS frontend served by nginx (section 3.1).
  # web:
  #   build: ./web
  #   ports:
  #     - "80:80"

volumes:
  db-data:
